name: ML pipeline
on:
  push:
  pull_request:
jobs:
  fixture-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python -m revenue_analysis.cli --data tests/fixtures/churn.csv --output model --min-pr-auc 0.60
      - run: docker build -f Dockerfile.staging -t revenue-staging:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-model-report
          path: model/report.json
